<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none';">
<title>InOffice Flow</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <header class="app-header">
    <div class="brand-logo">
      <img class="logo-img" src="assets/logo.png" alt="InOffice" width="28" height="28">
      <strong>InOffice</strong>
    </div>
    <span class="header-badge">Google Flow</span>
  </header>

  <div class="scene">
    <div class="illustration" id="illustration">
      <video class="door-video" src="assets/door.mp4" autoplay muted loop playsinline></video>
    </div>

    <p class="scene-label" id="sceneLabel">برای اتصال آماده‌اید</p>
  </div>

  <!-- Hidden toggle for actual functionality -->
  <button id="toggle" class="sr-only" role="switch" aria-checked="false" aria-label="فعال‌سازی ابزار کمکی" disabled></button>

  <div class="cta-container">
    <button id="cta" class="cta-btn" disabled>
      <span class="cta-text" id="ctaText">اتصال</span>
    </button>
  </div>

  <p class="hint" id="hint"></p>

  <p id="error" class="error" role="alert"></p>

  <footer class="foot">
    <nav class="social" aria-label="لینک‌ها">
      <a href="https://www.linkedin.com/in/hossein-shnyvry/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="لینکدین">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      </a>
      <a href="https://www.instagram.com/hossein_shnyvry/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="اینستاگرام">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <a href="https://t.me/hossein_shnyvry" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="تلگرام">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </a>
    </nav>
  </footer>
</main>
<script src="panel.js"></script>
</body>
</html>
